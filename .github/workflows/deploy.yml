name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  schedule:
    - cron: '0 * * * *'   # hourly, refreshes visitor count
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Refresh visitor count
        run: |
          if curl -sf "https://roboindex.goatcounter.com/counter/TOTAL.json" \
               -o public/visitor-count.json.new; then
            mv public/visitor-count.json.new public/visitor-count.json
          else
            echo "GoatCounter fetch failed, keeping committed visitor-count.json"
            rm -f public/visitor-count.json.new
          fi

      - name: Build
        run: npm run prebuild && npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
