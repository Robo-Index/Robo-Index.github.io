title: "RAL Common Pitfalls"
title_zh: "RAL 投稿常见坑点"
category: format
venue: RA-L
sections:
  - heading: "Desk Rejection Triggers"
    heading_zh: "会被 Desk Reject 的操作"
    items:
      - text: "Including web or video links in the paper"
        text_zh: "论文中放网页链接或视频链接"
        source: guide
      - text: "Uploading appendix or supplementary text"
        text_zh: "上传 appendix 或额外文字补充材料"
        source: guide
      - text: "Including anonymous links (some AEs reject immediately)"
        text_zh: "放匿名链接（部分 AE 会直接 reject）"
        source: community

  - heading: "Formatting Traps"
    heading_zh: "格式踩雷"
    items:
      - text: "Using trans template for initial submission (should use conf)"
        text_zh: "初稿使用 ieee trans 模板（应该用 conf 模板）"
        source: guide
      - text: "Adjusting page margins"
        text_zh: "调整页面 margin"
        source: guide
      - text: "PDF over 8 pages — system won't accept it"
        text_zh: "PDF 超过 8 页，系统不允许上传"
        source: official
        url: "https://www.ieee-ras.org/publications/ra-l/final-submission-checklist/"

  - heading: "Submission System"
    heading_zh: "投稿系统"
    items:
      - text: "Submitter account = system corresponding author. Don't use your advisor's account"
        text_zh: "提交者账号 = 系统通讯作者。不要用老板账号提交"
        source: guide
      - text: "All operations on RAS PaperCept, not the IEEE system"
        text_zh: "所有操作在 RAS PaperCept 完成，不是 IEEE 系统"
        source: guide

  - heading: "Final Version"
    heading_zh: "Final Version"
    items:
      - text: "14 days after acceptance for camera-ready (hard deadline)"
        text_zh: "Accept 后 14 天内完成 camera-ready（hard deadline）"
        source: official
        url: "https://www.ieee-ras.org/publications/ra-l/final-submission-checklist/"
      - text: "Must switch to ieee trans template"
        text_zh: "必须换成 ieee trans 模板"
        source: guide
      - text: "Replace arxiv citations with published versions"
        text_zh: "把引用中的 arxiv 换成正式出版信息"
        source: guide
      - text: "Adding/removing authors requires notifying Editor and EiC with justification"
        text_zh: "增删作者需通知编辑和 EiC 并说明理由"
        source: official
        url: "https://www.ieee-ras.org/publications/ra-l/final-submission-checklist/"
